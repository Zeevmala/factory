name: curate

# Runs in the factory repository itself, once a week. Reads the week in every repo
# listed in brain/projects.txt (lessons, run and review comments, owner comments,
# outcomes, cost lines), has an agent write a dated digest and rewrite the playbooks,
# and opens one pull request that may touch brain/playbooks/ and brain/digests/ only.
# Same split as build.yml: the agent's job holds a read-only token; a clean job checks
# the patch's paths and publishes.

on:
  schedule:
    - cron: "37 6 * * 5" # Fridays 06:37 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      week: ${{ steps.gather.outputs.week }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Gather the week
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          since_day=${since%%T*}
          week=$(date -u +%G-W%V)
          echo "week=$week" >> "$GITHUB_OUTPUT"

          wk=.factory-run/week
          mkdir -p "$wk"
          printf '%s\n' ".factory-run/" >> .git/info/exclude
          cp prompts/curate.md .factory-run/prompt.md
          {
            echo "# Week $week"
            echo
            echo "Window: $since to $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "Digest file to write: brain/digests/$week.md"
          } > "$wk/INDEX.md"

          markers='<!-- factory-(run|review) -->'
          humans='["OWNER","MEMBER","COLLABORATOR"]'

          grep -vE '^[[:space:]]*(#|$)' brain/projects.txt | tr -d '\r' | while IFS= read -r repo; do
            if ! [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::warning::brain/projects.txt: skipping malformed line '$repo'"
              continue
            fi
            d="$wk/${repo//\//__}"
            src="$RUNNER_TEMP/src/${repo//\//__}"
            mkdir -p "$d/lessons"

            if ! git clone -q --filter=blob:none "https://github.com/$repo.git" "$src" 2>/dev/null \
               || ! gh api "repos/$repo" --jq .full_name >/dev/null 2>&1; then
              echo "Could not read $repo with this workflow's token (private, renamed or deleted)." > "$d/UNREADABLE"
              echo "::warning::$repo is not readable; skipped"
              continue
            fi

            git -C "$src" log --since="$since" --diff-filter=A --name-only --format= -- docs/brain/lessons \
              | sort -u | while IFS= read -r f; do
                  if [ -f "$src/$f" ]; then cp "$src/$f" "$d/lessons/"; fi
                done
            git -C "$src" log --since="$since" -p --format='commit %h %ad' --date=short -- docs/brain/DECISIONS.md > "$d/decisions.patch" || true
            git -C "$src" log --since="$since" --format='%h %ad %s' --date=short > "$d/commits.txt" || true

            gh api "repos/$repo/issues/comments?since=$since&per_page=100" --paginate --jq "
              .[] | select(.body | test(\"$markers\"))
              | \"## \" + .html_url + \" (\" + .created_at + \")\n\n\" + .body + \"\n\"" > "$d/factory-comments.md" \
              || echo "(could not be read)" > "$d/factory-comments.md"

            {
              gh api "repos/$repo/issues/comments?since=$since&per_page=100" --paginate --jq "
                .[] | select(.author_association as \$a | $humans | index(\$a))
                | select(.body | test(\"<!-- factory-\") | not)
                | \"## \" + .user.login + \" on \" + .html_url + \" (\" + .created_at + \")\n\n\" + .body + \"\n\"" \
                || echo "(issue comments could not be read)"
              gh api "repos/$repo/pulls/comments?since=$since&per_page=100" --paginate --jq "
                .[] | select(.author_association as \$a | $humans | index(\$a))
                | \"## \" + .user.login + \" on \" + .html_url + \" (\" + .path + \", \" + .created_at + \")\n\n\" + .body + \"\n\"" \
                || echo "(review comments could not be read)"
            } > "$d/owner-comments.md"

            gh pr list --repo "$repo" --state merged --search "merged:>=$since_day" --limit 100 \
              --json number,title,headRefName,mergedAt --jq '.[] | "- #\(.number) \(.title) [\(.headRefName)] merged \(.mergedAt)"' > "$d/merged.md" \
              || echo "(could not be read)" > "$d/merged.md"
            gh pr list --repo "$repo" --state closed --search "is:unmerged closed:>=$since_day" --limit 100 \
              --json number,title,headRefName,closedAt --jq '.[] | "- #\(.number) \(.title) [\(.headRefName)] closed \(.closedAt)"' > "$d/closed-unmerged.md" \
              || echo "(could not be read)" > "$d/closed-unmerged.md"
            gh issue list --repo "$repo" --state open --label ready-for-human --limit 100 \
              --json number,title,url --jq '.[] | "- #\(.number) \(.title) \(.url)"' > "$d/ready-for-human.md" \
              || echo "(could not be read)" > "$d/ready-for-human.md"

            echo "$repo: $(find "$d/lessons" -type f | wc -l | tr -d ' ') lesson(s), $(grep -c '^## ' "$d/factory-comments.md" || true) factory comment(s)"
          done

      - name: Curate
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }} # read-only in this job
          prompt: |
            You are the factory's unattended weekly curate run.
            Read `.factory-run/prompt.md` for your instructions and `.factory-run/week/INDEX.md` for this week, then do the work.
          # Enforced by Claude Code itself. Only the paths the publish job accepts are writable.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit(./.github/**)",
                  "Edit(./prompts/**)",
                  "Edit(./profiles/**)",
                  "Edit(./caller/**)",
                  "Edit(./*.ps1)",
                  "Edit(./brain/FACTS.md)",
                  "Edit(./brain/VOICE.md)",
                  "Edit(./brain/PRINCIPLES.md)",
                  "Edit(./brain/DECISIONS.md)",
                  "Edit(./brain/projects.txt)"
                ]
              }
            }
          claude_args: |
            --max-turns ${{ vars.FACTORY_CURATE_MAX_TURNS || '60' }}
            --model ${{ vars.FACTORY_CURATE_MODEL || 'opus' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,LS"

      - name: Package the proposal
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          mkdir -p brain/playbooks brain/digests # git add fails on a missing pathspec
          git add -A -- brain/playbooks brain/digests
          git diff --cached --binary --no-renames > "$out/brain.patch"
          stray=$(git status --porcelain --untracked-files=all | grep -vE '^.. brain/(playbooks|digests)/' || true)
          if [ -n "$stray" ]; then
            echo "::warning::The run changed files outside its scope; they are dropped:"
            echo "$stray"
          fi
          cost_cents=""
          if [ -n "${EXEC_FILE:-}" ] && [ -s "$EXEC_FILE" ]; then
            cost_cents=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty | . * 100 | round' "$EXEC_FILE" 2>/dev/null || true)
          fi
          echo "cost_cents=$cost_cents" > "$out/result.txt"
          echo "patch: $(wc -l < "$out/brain.patch") lines; cost_cents=${cost_cents:-?}"

      - name: Hand the proposal to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: curate-run
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: curate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WEEK: ${{ needs.curate.outputs.week }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the proposal
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: curate-run
          path: ${{ runner.temp }}/run

      # The patch came from the agent's runner: it is applied only if every path it
      # touches is a plain text file under brain/playbooks/ or brain/digests/.
      - name: Check, commit and open the pull request
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/run/brain.patch"
          [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]] || { echo "::error::Bad week value '$WEEK'"; exit 1; }
          if [ ! -s "$patch" ]; then echo "The run proposed no changes."; exit 0; fi

          # Only plain text files: no binary data, no renames, and every file mode 100644 (no symlinks, no executables).
          if grep -qE '^(GIT binary patch|Binary files |similarity index|rename (from|to) |copy (from|to) )' "$patch" \
             || grep -E '^(new file |deleted file |old |new )?mode ' "$patch" | grep -qvE 'mode 100644$'; then
            echo "::error::The patch has binary content, a symlink, an executable or a rename. Not applied."; exit 1
          fi
          git apply --check "$patch"
          bad=$(git apply --numstat "$patch" | cut -f3- \
            | grep -vE '^brain/(playbooks|digests)/[A-Za-z0-9._-]+\.md$' || true)
          if [ -n "$bad" ]; then
            echo "::error::The patch touches paths outside brain/playbooks/ and brain/digests/:"
            echo "$bad"
            exit 1
          fi

          branch="curate/$WEEK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          git apply --index "$patch"
          git commit -q -m "Curate $WEEK: digest and playbook updates"
          git push -q -f origin "HEAD:refs/heads/$branch"

          cost=$(grep -E '^cost_cents=[0-9]{1,8}$' "$RUNNER_TEMP/run/result.txt" 2>/dev/null | cut -d= -f2 || true)
          cost_text="not reported"
          if [ -n "$cost" ]; then cost_text="\$$(printf '%d.%02d' $((cost / 100)) $((cost % 100))) API-equivalent"; fi

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Weekly curate run for $WEEK ([log]($RUN_URL)). Cost: $cost_text."
            echo
            echo "Start with \`brain/digests/$WEEK.md\`: the week's numbers, causes of failure, what to stop, and changes only you can make. Then read the playbook diff; every rule cites its evidence."
            echo
            echo "Merging makes the new playbooks live for every run at once (runs read \`brain/\` from \`main\`). Close without merging to discard."
            echo
            echo '```text'
            git diff --stat HEAD~1 HEAD
            echo '```'
          } > "$body"

          PR=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --repo "$REPO" --head "$branch" --title "Curate $WEEK: digest and playbooks" --body-file "$body"
          else
            gh pr edit "$PR" --repo "$REPO" --body-file "$body"
          fi
